name: Refresh opportunity databases

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keryx-database-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/update.py
      - name: Commit changed databases
        run: |
          if git diff --quiet -- README.md internships new-grad archive data; then
            echo "No opportunity changes."
            exit 0
          fi
          git config user.name "keryx-bot"
          git config user.email "keryx-bot@users.noreply.github.com"
          git add README.md internships new-grad archive data
          git commit -m "data: refresh US opportunities [skip ci]"
          git push
