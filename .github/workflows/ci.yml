name: Validate pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "internships/**"
      - "new-grad/**"
      - "archive/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m unittest discover -s tests -v
